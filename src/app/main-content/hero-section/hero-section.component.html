<section id="hero" class="hero-section">
	<svg class="hero-bg-svg" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
		<path class="hero-svg-path" d="M -100 200 C 300 50, 700 450, 1100 250" stroke="var(--accent-primary)" stroke-width="2" fill="none" stroke-dasharray="1000" stroke-dashoffset="1000" />
		<path class="hero-svg-path" d="M -100 400 C 400 600, 600 100, 1100 350" stroke="var(--border-medium)" stroke-width="1.5" fill="none" stroke-dasharray="1000" stroke-dashoffset="1000" />
	</svg>

	<div class="main-content-wrapper">

		<div class="text-content">
			<div class="hello-world-badge">
				<app-hello-button></app-hello-button>
			</div>

			<h1 class="main-title" [attr.aria-label]="'Marcus Gühne'">
				@for (letter of frontLetters(); track $index) {
					<span aria-hidden="true" class="letter">
						{{ letter === ' ' ? '\u00A0' : letter }}
					</span>
				}
			</h1>

			<div class="subtitle-wrapper">
				<h2 class="main-subtitle" [attr.aria-label]="'Frontend Developer'">
					@for (letter of devLetters(); track $index) {
						<span aria-hidden="true" class="letter">
							{{ letter === ' ' ? '\u00A0' : letter }}
						</span>
					}
				</h2>

				<div class="cta-container">
					<a href="#contact" (click)="scrollToContact($event)" appMagnetic [magneticStrength]="0.35" class="get-in-touch-btn btn-primary" [title]="'button.getBtnTitle' | translate">
						{{ 'button.getBtn' | translate }}
					</a>
				</div>
			</div>
		</div>

		<div class="portrait-container">
			<div class="polaroid-frame" (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()"
				[style.transform]="transformStyle()">

				<img ngSrc="assets/ProjectsImg/portImg.webp" alt="Porträtfoto von Marcus Gühne" width="276" height="367"
					priority class="portrait-img">

			</div>
		</div>

		<div class="social-sidebar">
			@for (link of socialLinks(); track link.url) {
				<a [href]="link.url" appMagnetic [magneticStrength]="0.25" [attr.aria-label]="link.alt" target="_blank" class="social-icon">
					<img [src]="link.icon" alt="" role="presentation" [attr.width]="link.w" [attr.height]="link.h">
				</a>
			}
		</div>

	</div>
</section>
