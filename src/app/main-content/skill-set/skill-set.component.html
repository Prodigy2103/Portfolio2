<section id="skill" class="skills-section">
    <div class="max-container">

        <div class="skill-header">
            <p class="overline">{{ 'skills.title' | translate }}</p>
            <h2 class="main-heading">{{ 'skills.privacyline' | translate }}</h2>
            <div class="accent-line"></div>
        </div>

        <div class="description-box">
            <p [innerHTML]="'skills.description' | translate"></p>
        </div>

        <div class="skills-grid">
            @for (skill of skillIcons(); track skill.name) {
                <div class="skill-card editorial-card">
                    <div class="icon-wrapper">
                        <img [ngSrc]="skill.src" [alt]="skill.name" [width]="skill.w" [height]="skill.h" />
                    </div>
                    <span class="skill-name">{{ skill.name }}</span>
                </div>
            }
        </div>

        <div class="peel-wrapper">
            <div class="sticker-container" (click)="toggleCover()">

                <div class="sticker-reveal" [class.active]="!isCoverVisible()">
                    <p class="reveal-title" [innerHTML]="'skills.interested' | translate"></p>
                    <div class="reveal-icons-row">
                        @for (peel of peelIcons(); track peel.name) {
                            <div class="reveal-item">
                                <img [src]="peel.src" [alt]="peel.name" [attr.width]="peel.w" [attr.height]="peel.h" />
                                <span>{{ peel.name }}</span>
                            </div>
                        }
                    </div>
                </div>

                <div class="sticker-cover" [class.peeled]="!isCoverVisible()">
                    <p class="peel-label" [innerHTML]="'skills.peelAni' | translate"></p>
                    <span class="finger-emoji">👉</span>
                </div>

            </div>
        </div>

    </div>
</section>
