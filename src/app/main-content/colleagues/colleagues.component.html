<section class="testimonials-section">
	<div class="max-container">

		<div class="section-header">
			<p class="overline">{{ 'colleagues.intheirwords' | translate }}</p>
			<h2 class="main-heading">{{ 'colleagues.thoughts' | translate }}</h2>
			<div class="accent-line"></div>
		</div>

		<div class="testimonials-grid">
			@for (person of colleagues(); track person.id) {
				<app-single-info [singleperson]="person" class="testimonial-card">
				</app-single-info>
			}
		</div>
	</div>
</section>
