<div class="card-body">
    <p class="quote">
        "{{ singleperson().person | translate }}"
    </p>

    <div class="profile-footer">
        <div class="meta">
            <h3>{{ singleperson().name }}</h3>
            <span class="position">{{ singleperson().position }}</span>
        </div>

        @if (singleperson().logo) {
            <div class="linkedin-box">
                <a [href]="singleperson().link" target="_blank" class="linkedin-link btn-primary">
                    <img src="assets/Extras/icons8-linkedin-52.png" alt="LinkedIn">
                    <span>{{ 'colleagues.profile' | translate }}</span>
                </a>
            </div>
        }
    </div>
</div>
